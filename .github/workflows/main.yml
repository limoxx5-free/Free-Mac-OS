name: macOS Interfaccia Grafica Reale

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Attivare Schermo Nativo del Mac
        run: |
          echo "=== Configurazione Schermo Apple ==="
          # Comandi singoli e puliti accettati dal sistema operativo
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy yes -setvncpw PasswordSicura123
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
          echo "=== Schermo Apple Attivato ==="

      - name: Installare ed Avviare Tunnel Cloudflare
        run: |
          echo "=== Installazione Cloudflared ==="
          brew install cloudflared
          
          echo "=== Avvio del Tunnel Grafico in Background ==="
          # Crea un tunnel TCP sulla porta dello schermo (5900) senza account o registrazioni
          cloudflared tunnel --url tcp://localhost:5900 > cloudflare.log 2>&1 &
          
          echo "=== Attesa generazione indirizzo (15 secondi) ==="
          sleep 15
          
          echo "--------------------------------------------------------"
          echo " INDIRIZZO PER CONNETTERTI AL DESKTOP DEL MAC:"
          grep -oE "[a-zA-Z0-9.-]+\.trycloudflare\.com:[0-9]+" cloudflare.log || cat cloudflare.log
          echo " Password dello Schermo: PasswordSicura123"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione grafica stabile. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
