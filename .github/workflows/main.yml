name: Connessione macOS 14 Desktop via RustDesk

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-14
    
    steps:
      - name: Imposta password utente del Runner (Forzato)
        run: |
          sudo sysadminctl -deleteUserPassword runner
          sudo sysadminctl -resetPasswordFor runner -newPassword "MiaPassword123!"

      - name: Sblocca Firewall e Schermo macOS
        run: |
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: Installa ed Esegui RustDesk
        run: |
          # 1. Installa l'applicazione RustDesk
          brew install --cask rustdesk
          
          # 2. Definiamo il percorso corretto dell'eseguibile di RustDesk su macOS
          RUSTDESK_BIN="/Applications/RustDesk.app/Contents/MacOS/RustDesk"
          
          # 3. Avvia il servizio core di RustDesk in background come amministratore
          sudo "$RUSTDESK_BIN" --service > /dev/null 2>&1 &
          sleep 5
          
          # 4. Imposta la password fissa per l'iPad
          "$RUSTDESK_BIN" --password "MiaPassword123!"
          
          # 5. Stampa l'ID unico nei log di GitHub per permetterti di connetterti
          echo "============================================="
          echo "IL TUO ID UNICO PER IL COLLEGAMENTO È:"
          "$RUSTDESK_BIN" --get-id
          echo "============================================="

      - name: Mantieni il workflow attivo
        run: |
          sleep 21600
