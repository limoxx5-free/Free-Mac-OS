name: Mac Grafico Microsoft (Zero Errori)

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Avvia il Tunnel Ufficiale Microsoft VS Code
        uses: sersoft-gmbh/vscode-tunnel-action@v2
        with:
          # Questo avvia il tunnel nativo in modo sicuro e stabile
          provider: 'github'

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Mac connesso in modalità grafica. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
