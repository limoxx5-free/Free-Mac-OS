name: macOS Remote Desktop (AnyDesk Fix)

on: 
  workflow_dispatch:

jobs:
  anydesk-setup:
    runs-on: macos-latest
    steps:
      - name: Installare AnyDesk
        run: |
          echo "=== Installazione tramite Brew ==="
          brew install --cask anydesk

      - name: Inizializzare Servizio di Sistema
        run: |
          echo "=== Registrazione del servizio permanente ==="
          # Diamo i permessi di esecuzione corretti all'applicazione
          sudo chmod +x /Applications/AnyDesk.app/Contents/MacOS/AnyDesk
          
          echo "=== Avvio del servizio in background ==="
          # Avviamo il servizio AnyDesk come root per generare i file necessari
          sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --service &
          
          echo "=== Attesa avvio servizio (20 secondi) ==="
          sleep 20

      - name: Configurare Password ed Estrarre ID
        run: |
          echo "=== Impostazione della password ==="
          # Ora che il servizio ha avuto 20 secondi per svegliarsi, passiamo la password
          echo "PasswordSicura123" | sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --set-password
          
          echo "=== Recupero ID di Connessione ==="
          ANYDESK_ID=$(/Applications/AnyDesk.app/Contents/MacOS/AnyDesk --get-id)
          echo "--------------------------------------------------------"
          echo "Il tuo ID AnyDesk per la connessione è: $ANYDESK_ID"
          echo "Password impostata: PasswordSicura123"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione il Runner per 6 ore
        run: |
          echo "Il runner rimarrà attivo per 6 ore."
          for i in {1..72}; do
            echo "Stato del runner: ATTIVO. Minuti trascorsi: $(( (i-1) * 5 ))"
            sleep 300
          done

