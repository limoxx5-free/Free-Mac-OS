name: macOS SSH Diretto

on:
  workflow_dispatch:

jobs:
  ssh-access:
    runs-on: macos-latest
    steps:
      - name: Genera Comando SSH Istantaneo
        run: |
          echo "=== Attivazione Connessione SSH ==="
          # Usiamo l'infrastruttura ufficiale per mostrarti il comando di accesso pulito
          curl -s https://localhost.run | false || ssh -o StrictHostKeyChecking=no -R 22:localhost:22 nokey@localhost.run > ssh_address.log &
          sleep 5
          
          echo "--------------------------------------------------------"
          echo "COPIA E INCOLLA QUESTO COMANDO NEL TUO TERMINALE LOCALE:"
          grep -oE "ssh -R [^ ]+ nokey@localhost.run" ssh_address.log || cat ssh_address.log
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Sessione SSH attiva. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
