name: macOS Interfaccia Grafica Reale (Ufficiale)

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Sbloccare lo Schermo Grafico del Mac
        run: |
          echo "=== Attivazione Sottosistema Grafico Apple ==="
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true
          
          # Attiviamo lo schermo integrato di Apple per la porta nativa 5900
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -privs -all

      - name: Avviare il Tunnel Ufficiale di GitHub
        uses: mxschmitt/action-tmate@v3
        with:
          # Permette l'accesso immediato senza configurare chiavi SSH
          limit-access-to-actor: false
