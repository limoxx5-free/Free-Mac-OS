name: Mac Grafico Automatico via Browser

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Installare il Server Grafico Web
        run: |
          echo "=== Installazione strumenti grafici nativi ==="
          # Installiamo un server VNC e NoVNC tramite Node.js per evitare comandi mancanti
          npm install -g vnc-server novnc localtunnel

      - name: Avviare il Desktop e il Tunnel Web
        run: |
          echo "=== Avvio del Server Grafico Virtuale ==="
          # Avvia il server grafico sulla porta standard
          vnc-server --port 5900 &
          sleep 5
          
          echo "=== Attivazione dell'interfaccia Web (NoVNC) ==="
          # Converte il segnale video in una pagina web sulla porta 8080
          novnc --vnc localhost:5900 --listen 8080 &
          sleep 5
          
          echo "=== Apertura del Tunnel internet automatico ==="
          # Crea il link pubblico sulla porta web 8080
          lt --port 8080 > localtunnel.log &
          sleep 10
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK QUI SOTTO PER APRIRE IL MAC NEL BROWSER:"
          cat localtunnel.log
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione mantenuta. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
