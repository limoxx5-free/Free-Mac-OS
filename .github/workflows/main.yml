name: macOS Graphic Desktop (RustDesk)

on:
  workflow_dispatch:

jobs:
  remote-mac-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa e Configura RustDesk
        run: |
          # Scarica e installa RustDesk tramite Homebrew
          brew install --cask rustdesk
          
          # Imposta una password fissa per la connessione grafica
          # SOSTITUISCI 'LaTuaPasswordFissa123' CON LA TUA PASSWORD
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --set-password LaTuaPasswordFissa123
          
          # Avvia il servizio in background
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --service &
          
          sleep 5
          
          echo "===================================================="
          echo "RUSTDESK INSTALLATO CON SUCCESSO!"
          echo "Apri l'app RustDesk sul tuo PC e usa la tua password."
          echo "Visualizzazione dell'ID RustDesk nei log qui sotto:"
          echo "===================================================="
          
          # Mostra l'ID univoco a schermo
          /Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id

      - name: Mantieni la macchina virtuale attiva
        run: |
          # Mantiene la macchina viva per 6 ore
          sleep 21600
