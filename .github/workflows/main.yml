name: macOS Interfaccia Grafica Reale (Browser)

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Installare Strumenti
        run: |
          echo "=== Installazione di Ngrok e TigerVNC App ==="
          brew install --cask ngrok tigervnc

      - name: Attivare Sottosistema Grafico Apple
        run: |
          echo "=== Configurazione Monitor Virtuale ==="
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true

      - name: Configurare e Avviare il Tunnel Web Grafico
        run: |
          echo "=== Autenticazione Ngrok ==="
          ngrok config add-authtoken "3EoMAQM9GPofB8ve0Ur2rgD5K8t_2tqfrr56vyM8QNhUNiELX"
          
          echo "=== Avvio dell'applicazione Grafica ==="
          # Avviamo direttamente l'eseguibile dentro l'app installata da brew in background
          /Applications/TigerVNC.app/Contents/MacOS/TigerVNC -vnc &
          sleep 5
          
          echo "=== Apertura del Tunnel Pubblico Grafico ==="
          # Apriamo il tunnel sulla porta standard della condivisione schermo (5900)
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 12
          
          echo "--------------------------------------------------------"
          echo " INDIRIZZO PER CONNETTERTI AL DESKTOP DEL MAC:"
          curl -s http://127.0.0 | jq -r '.tunnels.public_url'
          echo "--------------------------------------------------------"
          echo "Nota: Copia l'indirizzo tcp:// generato e incollalo nel tuo client VNC locale."

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Schermo del Mac ATTIVO. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
