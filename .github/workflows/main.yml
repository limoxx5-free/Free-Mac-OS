name: Mac Remoto Istantaneo (Zero Configurazione)

on:
  workflow_dispatch:

jobs:
  connessione-rapida:
    runs-on: macos-latest
    steps:
      - name: Avvia il Terminale Remoto nel Browser
        run: |
          echo "=== Installazione dello strumento di connessione ==="
          brew install tmate
          
          echo "=== Avvio della sessione in background ==="
          tmate -F &
          
          echo "=== Attesa generazione del link web (10 secondi) ==="
          sleep 10
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK WEB QUI SOTTO PER ENTRARE NEL MAC:"
          tmate display -p '#{tmate_web}'
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione il Runner per 6 ore
        run: |
          for i in {1..72}; do
            echo "Mac attivo. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
