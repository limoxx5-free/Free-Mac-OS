name: Mac Grafico Microsoft (Zero Errori)

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Attivare il Sottosistema Microsoft Web
        run: |
          echo "=== Scaricamento dello strumento ufficiale di tunneling ==="
          # Scarichiamo la CLI ufficiale stabile di VS Code per Mac
          curl -Lk "https://visualstudio.com" --output code-cli.tar.gz
          tar -xf code-cli.tar.gz
          
          echo "=== Avvio del Tunnel sicuro Microsoft ==="
          # Avviamo il tunnel accettando i termini e salvando il link nei log
          ./code tunnel --accept-server-license-terms > microsoft.log &
          
          echo "=== Generazione del link di accesso (15 secondi) ==="
          sleep 15
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK QUI SOTTO PER ENTRARE NEL MAC:"
          grep -oE "https://vscode.dev[^ ]+" microsoft.log || cat microsoft.log
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Mac connesso ai server Microsoft Azure. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
