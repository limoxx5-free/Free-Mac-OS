name: Connessione macOS 14 Desktop (Risolutivo iPad)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-14
    
    steps:
      - name: Imposta password utente del Runner (Forzato)
        run: |
          sudo sysadminctl -deleteUserPassword runner
          sudo sysadminctl -resetPasswordFor runner -newPassword "MiaPassword123!"

      - name: Configura e Forza Screen Sharing Nativo
        run: |
          # Configura lo schermo console VNC
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAccessPassword -string "MiaPassword123!"
          
          # Disattiva il firewall di sistema
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off
          
          # Avvia l'agente remoto ufficiale di Apple
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -allowAccessFor -allUsers -privs -all -restart -agent

      - name: Connetti Rete Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5
          
          # La tua nuova chiave Tailscale è inserita qui sotto
          sudo tailscale up --authkey "tskey-auth-kBFQ4Y3bx811CNTRL-SF3cdBbzupgAoTupXk32qgmTUsoPQkv28" --accept-dns=false
          
          echo "============================================="
          echo "IL TUO NUOVO IP DA INSERIRE IN VNC VIEWER:"
          tailscale ip -4
          echo "============================================="

      - name: Mantieni il workflow attivo
        run: |
          sleep 21600
