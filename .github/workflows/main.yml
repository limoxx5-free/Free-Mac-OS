name: macOS Interfaccia Grafica Reale (No Schermo Bianco)

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Sbloccare Forzatamente il Motore Grafico del Mac
        run: |
          echo "=== Sveglia del Sottosistema Video di Apple ==="
          # Comandi per impedire al Mac virtuale di andare in standby o mostrare schermate vuote
          sudo defaults write /Library/Preferences/com.apple.windowserver.plist DisplayResolutionEnabled -bool true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true
          
          # Attiviamo il server dello schermo nativo di Apple con tutti i permessi amministrativi
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy yes -setvncpw PasswordSicura123
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
          echo "=== Schermo Apple Pronto e Sveglio ==="

      - name: Installare ed Configurare Ngrok
        run: |
          echo "=== Installazione di Ngrok ==="
          brew install --cask ngrok
          
          echo "=== Autenticazione con il tuo Token ==="
          ngrok config add-authtoken "3EoMAQM9GPofB8ve0Ur2rgD5K8t_2tqfrr56vyM8QNhUNiELX"

      - name: Avviare il Tunnel Grafico
        run: |
          echo "=== Apertura del Tunnel sulla porta video (5900) ==="
          # Lanciamo il tunnel TCP diretto sulla porta 5900 del Mac
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 12
          
          echo "--------------------------------------------------------"
          echo " ECCO LE TUE CHIAVI DELLA FERRARI. CONNETTITI QUI:"
          # Estrae l'indirizzo reale per il tuo client VNC
          curl -s http://127.0.0 | jq -r '.tunnels.public_url'
          echo " Password dello Schermo: PasswordSicura123"
          echo "--------------------------------------------------------"
          echo "NOTA: Rimuovi 'tcp://' dall'indirizzo quando lo incolli nel programma."

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Schermo del Mac ATTIVO. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
