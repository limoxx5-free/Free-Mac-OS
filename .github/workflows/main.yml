name: macOS Interfaccia Grafica Reale (Browser)

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Sbloccare lo Schermo Grafico del Mac
        run: |
          echo "=== Attivazione Sottosistema Grafico Apple ==="
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true

      - name: Installare NoVNC e Ngrok
        run: |
          echo "=== Installazione strumenti di rete e interfaccia ==="
          # Installiamo NoVNC ed il client VNC per Mac
          brew install tigervnc
          sudo npm install -g novnc
          brew install --cask ngrok

      - name: Configurare e Avviare il Tunnel Web Grafico
        run: |
          echo "=== Autenticazione Ngrok ==="
          # Inseriamo il tuo token in modo sicuro all'interno del gestore di Ngrok
          ngrok config add-authtoken "3EoMAQM9GPofB8ve0Ur2rgD5K8t_2tqfrr56vyM8QNhUNiELX"
          
          echo "=== Avvio del Server Grafico di Sistema ==="
          # Creiamo il display grafico virtuale sulla porta standard 5901
          mkdir -p ~/.vnc
          echo "PasswordSicura123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          vncserver :1 -geometry 1280x720 -localhost no -rfbauth ~/.vnc/passwd &
          sleep 5
          
          echo "=== Avvio dell'interfaccia grafica Web (NoVNC) ==="
          # Colleghiamo la grafica del Mac alla porta web 8080 per il tuo browser
          novnc --vnc localhost:5901 --listen 8080 &
          sleep 5
          
          echo "=== Apertura del Tunnel Pubblico Sicuro ==="
          # Lanciamo il tunnel sulla porta web 8080
          ngrok http 8080 --log=stdout > ngrok.log &
          sleep 12
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK WEB QUI SOTTO PER APRIRE IL MAC:"
          curl -s http://127.0.0 | jq -r '.tunnels[0].public_url'
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Schermo del Mac ATTIVO sul browser. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
