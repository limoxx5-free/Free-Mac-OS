name: Mac Remoto Microsoft (Zero Errori)

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Attivare il Tunnel Microsoft Nattivo
        run: |
          echo "=== Scaricamento dello strumento ufficiale di tunneling ==="
          curl -Lk https://visualstudio.com\&os=cli-alpine-x64 --output code-cli.tar.gz
          tar -xf code-cli.tar.gz
          
          echo "=== Avvio del Tunnel sicuro Microsoft ==="
          # Crea un tunnel crittografato diretto senza bisogno di account locali
          ./code tunnel --accept-server-license-terms > microsoft.log &
          
          echo "=== Generazione del link di accesso (15 secondi) ==="
          sleep 15
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK QUI SOTTO PER ENTRARE NEL MAC:"
          grep -oE "https://vscode.dev[^ ]+" microsoft.log || cat microsoft.log
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Mac connesso ai server Microsoft. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
