name: Connessione macOS 14 Desktop via RDP (Windows App)

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-14
    
    steps:
      - name: Imposta password utente del Runner (Forzato)
        run: |
          sudo sysadminctl -deleteUserPassword runner
          sudo sysadminctl -resetPasswordFor runner -newPassword "MiaPassword123!"

      - name: Installa e Configura Server RDP (xrdp)
        run: |
          # Installiamo il server RDP xrdp tramite Homebrew
          brew install xrdp
          
          # Configura e avvia il servizio in modalità amministratore
          sudo brew services start xrdp
          
          # Disattiva il firewall di macOS per azzerare i blocchi di rete
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: Installa e Connetti Tailscale
        run: |
          brew install tailscale
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5
          
          # Connessione automatica alla tua rete privata con la tua chiave
          sudo tailscale up --authkey "tskey-auth-kR9WV4QAFT11CNTRL-mXJYy5CqyrhdoSnTaPV1shHgikUSTtTf" --accept-dns=false
          
          echo "============================================="
          echo "IL TUO IP TAILSCALE PER IL COLLEGAMENTO È:"
          tailscale ip -4
          echo "============================================="

      - name: Mantieni il workflow attivo
        run: |
          sleep 21600
