name: Mac Grafico Automatico

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Attivare Schermo Nativo del Mac
        run: |
          echo "=== Configurazione Condivisione Schermo Apple ==="
          # Attiviamo lo schermo grafico nativo con i comandi separati richiesti dal Mac
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -clientopts -setvnclegacy yes -setvncpw PasswordSicura123
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent
          echo "=== Schermo Attivo ==="

      - name: Avviare Tunnel Automatico
        run: |
          echo "=== Installazione del Tunnel ==="
          # Installiamo localtunnel globalmente usando npm (già pronto sul Mac)
          sudo npm install -g localtunnel
          
          echo "=== Apertura del Tunnel sulla porta 5900 ==="
          # Avviamo il tunnel in background sulla porta VNC (5900)
          lt --port 5900 > localtunnel.log &
          
          echo "=== Attesa generazione indirizzo (10 secondi) ==="
          sleep 10
          
          echo "--------------------------------------------------------"
          echo " DATI PER CONNETTERTI AL DESKTOP DEL MAC:"
          cat localtunnel.log
          echo " Password VNC: PasswordSicura123"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione mantenuta. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
