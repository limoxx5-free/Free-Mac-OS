name: Connessione macOS 14 Desktop via RustDesk / Remotely

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-14
    
    steps:
      - name: Imposta password utente del Runner (Forzato)
        run: |
          sudo sysadminctl -deleteUserPassword runner
          sudo sysadminctl -resetPasswordFor runner -newPassword "MiaPassword123!"

      - name: Sblocca Firewall e Schermo macOS
        run: |
          # Elimina i blocchi di sicurezza video nativi di macOS 14
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
          sudo /usr/libexec/ApplicationFirewall/socketfilterfw --setglobalstate off

      - name: Installa ed Esegui l'Agente Remoto
        run: |
          # Scarica il client di controllo remoto compatibile con Apple Silicon (M1/M2)
          brew install --cask rustdesk
          
          # Avvia il servizio in background e genera l'ID di connessione pubblico
          sudo launchctl load -w /Library/LaunchDaemons/com.rustdesk.rustdesk.plist || true
          sleep 10
          
          # Forza la configurazione di una password fissa per l'accesso dall'iPad
          rustdesk --password "MiaPassword123!"
          
          # Estrae e stampa l'ID unico sul log di GitHub per permetterti di connetterti
          echo "============================================="
          echo "IL TUO ID UNICO PER IL COLLEGAMENTO È:"
          rustdesk --get-id
          echo "============================================="

      - name: Mantieni il workflow attivo
        run: |
          # Mantiene la macchina virtuale accesa per 6 ore
          sleep 21600
