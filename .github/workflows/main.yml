name: macOS Interfaccia Grafica Reale (Browser)

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Sbloccare lo Schermo Grafico del Mac
        run: |
          echo "=== Attivazione Sottosistema Grafico Apple ==="
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true
          
          # Attiviamo lo schermo integrato di Apple per assicurarci che risponda sulla porta 5900
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -allowAccessFor -allUsers -privs -all
          
          echo "=== Installazione Server Grafico Web Python ==="
          pip install websockify

      - name: Avviare il Server e il Tunnel Pubblico Gratuito
        run: |
          echo "=== Avvio del Server Interfaccia Web sulla porta 8080 ==="
          websockify 8080 localhost:5900 &
          sleep 5
          
          echo "=== Apertura del Tunnel con Serveo (Bypass Controllo Chiavi) ==="
          # Le opzioni -o StrictHostKeyChecking=no e UserKnownHostsFile impediscono il fallimento Host key verification
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -R 80:localhost:8080 serveo.net > serveo.log &
          sleep 15
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK WEB QUI SOTTO PER APRIRE IL MAC:"
          grep -oE "https://[^ ]+" serveo.log || cat serveo.log
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Schermo del Mac ATTIVO sul browser. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
