name: macOS Remote Desktop with AnyDesk

on: 
  workflow_dispatch:

jobs:
  anydesk-setup:
    runs-on: macos-latest
    steps:
      - name: Installare AnyDesk
        run: |
          echo "=== Installazione rapida tramite Brew ==="
          brew install --cask anydesk

      - name: Configurare e Forzare l'Avvio di AnyDesk
        run: |
          echo "=== Impostazione della password ==="
          # Imposta la password di sicurezza (sostituisci se vuoi)
          echo "LaTuaPasswordSicura123" | sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --set-password
          
          echo "=== Registrazione del servizio grafico di sistema ==="
          # Questo comando forza macOS a registrare AnyDesk come servizio di login persistente
          sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --register-service
          
          echo "=== Avvio forzato del servizio ==="
          sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --service &
          
          echo "=== Attesa registrazione sui server ==="
          sleep 15
          
          echo "=== RECUPERO ID CONNESSIONE ==="
          ANYDESK_ID=$(/Applications/AnyDesk.app/Contents/MacOS/AnyDesk --get-id)
          echo "--------------------------------------------------------"
          echo "Il tuo ID AnyDesk per la connessione è: $ANYDESK_ID"
          echo "Password: LaTuaPasswordSicura123"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione il Runner per 6 ore
        run: |
          echo "Il runner rimarrà attivo per 6 ore."
          for i in {1..72}; do
            echo "Stato del runner: ATTIVO. Minuti trascorsi: $(( (i-1) * 5 ))"
            sleep 300
          done
