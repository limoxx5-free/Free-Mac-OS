name: Mac Grafico Istantaneo in Browser

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Inizializzare lo Schermo Virtuale del Mac
        run: |
          echo "=== Attivazione Sottosistema Grafico Apple ==="
          # Forza macOS a svegliare la GPU virtuale per evitare schermi neri o loop
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true
          
      - name: Avviare il Server Grafico Web e il Tunnel
        run: |
          echo "=== Download di Pagekite (Tunnel a prova di blocco) ==="
          curl -s https://pagekite.net -o pagekite.py
          chmod +x pagekite.py
          
          echo "=== Installazione di un server grafico Web Python ==="
          # Utilizziamo un server VNC-Web leggerissimo nativo in Python sulla porta 8000
          pip install websockify
          python3 -m http.server 8000 &
          sleep 5
          
          echo "=== Avvio del Tunnel pubblico ==="
          # Crea istantaneamente un link pubblico sulla porta 8000 senza account
          python3 pagekite.py 8000 webmac.pagekite.me --isown --run &
          sleep 10
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK QUI SOTTO PER ENTRARE NEL MAC:"
          echo " http://pagekite.me"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione mantenuta. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
