name: Accesso Mac Remoto Istantaneo

on:
  workflow_dispatch:

jobs:
  remote-access:
    runs-on: macos-latest
    steps:
      - name: Avvio della sessione remota istantanea
        uses: mxschmitt/action-tmate@v3
        with:
          # Questo evita che il workflow si blocchi se un comando fallisce
          limit-access-to-actor: false

      - name: Mantieni in esecuzione per 6 ore
        run: |
          echo "Il runner rimarrà attivo per 6 ore."
          for i in {1..72}; do
            echo "Stato del runner: ATTIVO. Minuti trascorsi: $(( (i-1) * 5 ))"
            sleep 300
          done
