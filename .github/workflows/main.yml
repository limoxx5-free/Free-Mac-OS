name: macOS Graphic Desktop (RustDesk)

on:
  workflow_dispatch:

jobs:
  remote-mac-gui:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa e Configura RustDesk
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install --cask rustdesk
          
          echo "=== Avvio del servizio RustDesk ==="
          # Avvia il servizio di sistema
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --service &
          sleep 5

          echo "=== Impostazione Password Fissa ==="
          # Sintassi corretta per RustDesk 1.4+
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --option password LaTuaPasswordFissa123
          sleep 2

          echo "===================================================="
          echo "IL TUO ID RUSTDESK È:"
          /Applications/RustDesk.app/Contents/MacOS/rustdesk --get-id
          echo "===================================================="

      - name: Mantieni la macchina attiva
        run: |
          sleep 21600
