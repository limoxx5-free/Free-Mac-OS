name: Mac Grafico Fisso (No Bad Gateway)

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Installare Server Grafico e Tunnel
        run: |
          echo "=== Installazione strumenti di rete e grafica ==="
          # Installiamo TigerVNC (il server desktop) e localtunnel
          brew install tigervnc
          sudo npm install -g localtunnel

      - name: Avviare il Server Grafico (Porta 5900)
        run: |
          echo "=== Configurazione della Password VNC ==="
          # Imposta la password di sicurezza nel sistema di TigerVNC
          mkdir -p ~/.vnc
          echo "PasswordSicura123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          
          echo "=== Avvio del Desktop Virtuale ==="
          # Avviamo il server sulla porta nativa 5900 (:0) con una risoluzione standard
          vncserver :0 -geometry 1280x720 -localhost no -rfbauth ~/.vnc/passwd &
          
          echo "=== Attesa avvio del server grafica (10 secondi) ==="
          sleep 10

      - name: Avviare il Tunnel Automatico
        run: |
          echo "=== Apertura del Tunnel su internet ==="
          # Colleghiamo il tunnel direttamente al nostro server TigerVNC funzionante
          lt --port 5900 > localtunnel.log &
          
          echo "=== Attesa generazione link (10 secondi) ==="
          sleep 10
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK WEB O INCOLLALO NEL CLIENT VNC:"
          cat localtunnel.log
          echo " Password VNC: PasswordSicura123"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione mantenuta. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
