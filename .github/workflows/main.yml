name: Desktop Remoto ChromeOS

on:
  workflow_dispatch: # Ti permette di avviarlo manualmente dalla scheda Actions

jobs:
  chromeos:
    runs-on: ubuntu-latest
    steps:
    - name: Ottimizzazione Spazio e Abilitazione KVM
      run: |
        # Libera lo spazio necessario sul runner eliminando tool pesanti inutilizzati
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        # Configura i permessi per l'accelerazione hardware della macchina virtuale
        sudo chmod 666 /dev/kvm

    - name: Avvio Container ChromeOS Flex
      run: |
        # Scarica e avvia l'emulatore ChromeOS Flex (porta web interna: 8006)
        docker run -d --name chromeos \
          --device /dev/kvm \
          --cap-add NET_ADMIN \
          -p 8006:8006 \
          -e RAM_SIZE="4G" \
          -e CORES="2" \
          dockurr/chromeos:latest

    - name: Installazione e Avvio Cloudflare Tunnel
      run: |
        # Aggiunge il repository ufficiale stabile di Cloudflare e installa il pacchetto
        sudo mkdir -p /usr/share/keyrings
        curl -L https://cloudflare.com | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://cloudflare.com stable main" | sudo tee /etc/apt/sources.list.d/cloudflared.list
        sudo apt-get update && sudo apt-get install -y cloudflared
        
        echo "In attesa che l'istanza di ChromeOS completi l'inizializzazione..."
        sleep 40
        
        echo "=========================================================="
        echo "COPIA IL LINK .trycloudflare.com CHE APPARIRÀ QUI SOTTO:"
        echo "=========================================================="
        
        # Crea un tunnel pubblico temporaneo e gratuito verso la porta di ChromeOS
        cloudflared tunnel --url http://localhost:8006
