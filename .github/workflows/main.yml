name: macOS Interfaccia Grafica con RustDesk

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Installare RustDesk
        run: |
          echo "=== Installazione di RustDesk via Brew ==="
          brew install --cask rustdesk

      - name: Inizializzare ed Avviare il Servizio Grafico
        run: |
          echo "=== Avvio del servizio in background ==="
          # Avviamo RustDesk come servizio di sistema per aggirare i blocchi dello schermo di Apple
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --service &
          
          echo "=== Attesa generazione credenziali (20 secondi) ==="
          sleep 20

      - name: Recuperare le Credenziali di Accesso
        run: |
          echo "--------------------------------------------------------"
          echo " ECCO LE CHIAVI DELLA FERRARI PER RUSTDESK:"
          
          # Estraiamo l'ID e la Password autogenerati dai file di configurazione di RustDesk
          echo -n "Il tuo ID RustDesk è: "
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --get-id 2>/dev/null || echo "Generazione in corso..."
          
          echo -n "La tua Password è: "
          sudo /Applications/RustDesk.app/Contents/MacOS/rustdesk --password 2>/dev/null || echo "Controlla l'ID direttamente"
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione grafica RustDesk attiva. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
