name: macOS Interfaccia Grafica Reale

on:
  workflow_dispatch:

jobs:
  desktop-remoto:
    runs-on: macos-latest
    steps:
      - name: Sbloccare il Motore Grafico di macOS
        run: |
          echo "=== Inizializzazione della GPU Virtuale ==="
          # Sveglia il sistema di login grafico nativo del Mac per attivare i pixel dello schermo
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.loginwindow.plist 2>/dev/null || true
          
          # Configura e forza l'avvio della sessione grafica utente
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -configure -allowAccessFor -allUsers -privs -all
          
      - name: Installare e Avviare Remotely per il Controllo Visivo
        run: |
          echo "=== Scaricamento del Server Grafico Web ==="
          # Installiamo l'estensione grafica universale che gira via HTTP
          brew install remotely-cli || npm install -g remotely-cli
          
          echo "=== Avvio della condivisione schermo ==="
          # Avviamo il server sulla porta dello schermo e creiamo il tunnel istantaneo
          remotely-cli --port 5900 --share > remotely.log &
          
          echo "=== Attesa generazione della schermata (15 secondi) ==="
          sleep 15
          
          echo "--------------------------------------------------------"
          echo " CLICCA SUL LINK WEB SOTTO PER VEDERE IL DESKTOP DEL MAC:"
          grep -oE "https://[^ ]+" remotely.log || cat remotely.log
          echo "--------------------------------------------------------"

      - name: Mantieni in esecuzione per 6 ore
        run: |
          echo "Il runner rimarrà attivo con interfaccia grafica per 6 ore."
          for i in {1..72}; do
            echo "Schermo del Mac ATTIVO. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
