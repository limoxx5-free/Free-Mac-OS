name: Desktop Remoto ChromeOS

on:
  workflow_dispatch:

jobs:
  chromeos:
    runs-on: ubuntu-latest
    steps:
    - name: Ottimizzazione Spazio e Abilitazione KVM
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo chmod 666 /dev/kvm

    - name: Avvio Container ChromeOS Flex
      run: |
        docker run -d --name chromeos \
          --device /dev/kvm \
          --cap-add NET_ADMIN \
          -p 8006:8006 \
          -e RAM_SIZE="4G" \
          -e CORES="2" \
          dockurr/chromeos:latest

    - name: Installazione e Avvio Cloudflare Tunnel
      run: |
        # Scarica il pacchetto ufficiale Debian stabile direttamente dai server di Cloudflare
        wget -q https://equinox.io
        sudo dpkg -i cloudflared-stable-linux-amd64.deb
        
        echo "In attesa che l'istanza di ChromeOS completi l'inizializzazione..."
        sleep 40
        
        echo "=========================================================="
        echo "COPIA IL LINK .trycloudflare.com CHE APPARIRÀ QUI SOTTO:"
        echo "=========================================================="
        
        # Avvia il tunnel verso l'emulatore ChromeOS
        cloudflared tunnel --url http://localhost:8006
