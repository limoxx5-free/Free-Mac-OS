name: Connessione macOS 14 Desktop via Tailscale

on:
  workflow_dispatch:

jobs:
  macos-desktop:
    runs-on: macos-14
    
    steps:
      - name: Imposta password utente del Runner (Forzato)
        run: |
          sudo sysadminctl -deleteUserPassword runner
          sudo sysadminctl -resetPasswordFor runner -newPassword "MiaPassword123!"

      - name: Attiva lo Screen Sharing nativo di macOS
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -allowAccessFor -allUsers -privs -all

      - name: Installa e Connetti Tailscale
        run: |
          # Installa Tailscale tramite Homebrew
          brew install tailscale
          
          # Avvia il demone di background di Tailscale
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5
          
          # Effettua il login inserendo la tua chiave in chiaro nel codice
          # SOSTITUISCI LA STRINGA SOTTO CON LA TUA CHIAVE REALE
          sudo tailscale up --authkey "tskey-auth-kX2Bkdm5TP11CNTRL-GyHVCKsMSB66AbTqTWJiB64DWPVHdDDBN" --accept-dns=false
          
          # Mostra nei log l'IP privato assegnato a questa macchina virtuale
          echo "============================================="
          echo "IL TUO IP TAILSCALE PER IL COLLEGAMENTO È:"
          tailscale ip -4
          echo "============================================="

      - name: Mantieni il workflow attivo
        run: |
          # Mantiene la macchina virtuale accesa per 6 ore
          sleep 21600
