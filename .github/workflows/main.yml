name: Mac Grafico Istantaneo

on:
  workflow_dispatch:

jobs:
  connessione:
    runs-on: macos-latest
    steps:
      - name: Attivare Schermo Nativo del Mac
        run: |
          echo "=== Configurazione Condivisione Schermo Apple ==="
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setvncpasswd -vncpasswd PasswordSicura123
          
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent

      - name: Avviare Tunnel senza Account
        run: |
          echo "=== Installazione Strumenti ==="
          brew install ngrok jq
          
          echo "=== Avvio Tunnel Grafico ==="
          # Avvia ngrok senza configurare account, usando i server pubblici pronti
          ngrok tcp 5900 --log=stdout > ngrok.log &
          sleep 10
          
          echo "--------------------------------------------------------"
          echo " DATI PER CONNETTERTI AL DESKTOP DEL MAC:"
          NGROK_URL=$(curl -s http://127.0.0 | jq -r '.tunnels[0].public_url')
          echo " Indirizzo: $NGROK_URL"
          echo " Password VNC: PasswordSicura123"
          echo "--------------------------------------------------------"
          echo "Se usi un client VNC (es. RealVNC), rimuovi 'tcp://' dall'indirizzo."

      - name: Mantieni in esecuzione per 6 ore
        run: |
          for i in {1..72}; do
            echo "Connessione mantenuta. Minuti passati: $(( (i-1) * 5 ))"
            sleep 300
          done
